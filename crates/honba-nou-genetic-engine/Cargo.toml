[package]
name = "honba-nou-genetic-engine"
version = "0.1.0"
edition = "2024"
description = "StockSharp Odysseus Port: types and interfaces for genetic strategy synthesis"

[dependencies]
honba-core = { workspace = true }
honba-nou-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1" }
rust_decimal_macros = { workspace = true }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
