[workspace]
resolver = "2"
members = [
  "crates/honba-nou-agent",
  "crates/honba-nou-analytics",
  "crates/honba-nou-llm",
  "crates/honba-nou-prompt",
  "crates/honba-nou-strategy",
  "crates/honba-nou-trader-loop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/your-org/honba-nou"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust_decimal = "1"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono"] }
schemars = { version = "0.8", features = ["derive"] }

honba-nou-agent       = { path = "crates/honba-nou-agent" }
honba-nou-analytics   = { path = "crates/honba-nou-analytics" }
honba-nou-llm         = { path = "crates/honba-nou-llm" }
honba-nou-prompt      = { path = "crates/honba-nou-prompt" }
honba-nou-strategy    = { path = "crates/honba-nou-strategy" }
honba-nou-trader-loop = { path = "crates/honba-nou-trader-loop" }

# Aliases
honba-analytics       = { package = "honba-nou-analytics", path = "crates/honba-nou-analytics" }
honba-strategy        = { package = "honba-nou-strategy", path = "crates/honba-nou-strategy" }

# Cross-repo dependencies
honba-kokoro-types     = { path = "../honba-kokoro/crates/honba-kokoro-types" }
honba-kokoro-messages  = { path = "../honba-kokoro/crates/honba-kokoro-messages" }
honba-kokoro-entities  = { path = "../honba-kokoro/crates/honba-kokoro-entities" }
honba-kokoro-risk      = { path = "../honba-kokoro/crates/honba-kokoro-risk" }
honba-messages         = { package = "honba-kokoro-messages", path = "../honba-kokoro/crates/honba-kokoro-messages" }
honba-entities         = { package = "honba-kokoro-entities", path = "../honba-kokoro/crates/honba-kokoro-entities" }
honba-risk             = { package = "honba-kokoro-risk", path = "../honba-kokoro/crates/honba-kokoro-risk" }

honba-me-market        = { path = "../honba-me/crates/honba-me-market" }
honba-me-feed          = { path = "../honba-me/crates/honba-me-feed" }
honba-me-indicators    = { path = "../honba-me/crates/honba-me-indicators" }
honba-market           = { package = "honba-me-market", path = "../honba-me/crates/honba-me-market" }
honba-feed             = { package = "honba-me-feed", path = "../honba-me/crates/honba-me-feed" }
honba-indicators       = { package = "honba-me-indicators", path = "../honba-me/crates/honba-me-indicators" }

honba-ya-engine        = { path = "../honba-ya/crates/honba-ya-engine" }
honba-ya-sim           = { path = "../honba-ya/crates/honba-ya-sim" }
honba-ya-testing       = { path = "../honba-ya/crates/honba-ya-testing" }
honba-engine           = { package = "honba-ya-engine", path = "../honba-ya/crates/honba-ya-engine" }
honba-sim              = { package = "honba-ya-sim", path = "../honba-ya/crates/honba-ya-sim" }
honba-testing          = { package = "honba-ya-testing", path = "../honba-ya/crates/honba-ya-testing" }
